name: Data correction
description: A value shown on the site is wrong (this will usually be forwarded to solar-system-db)
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Catalogue values come from [solar-system-db](https://github.com/Wicked-Sick-Ltd/solar-system-db).
        If you can, file this there instead. If you're not sure, file it here and we'll route it.
  - type: input
    id: object
    attributes:
      label: Object id or page URL
      placeholder: dwarf-pluto, or https://sol.wickedsick.com/objects/dwarf-pluto
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value shown
      placeholder: Semi-major axis 39.48 AU
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Proposed value
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: NASA/JPL, the IAU Minor Planet Center, or a peer-reviewed paper. Wikipedia alone isn't enough.
    validations:
      required: true
