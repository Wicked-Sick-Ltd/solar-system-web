name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release metadata without secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -m unittest discover -s tests/release -v
          python3 scripts/check-release.py --base "$BASE_SHA"

  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The locked dependency graph (symfony 8.1) requires PHP >= 8.4.1.
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, curl, dom, fileinfo, intl, imagick
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Verify deployment ordering with fake executables
        run: python3 -m unittest discover -s tests/deployment -v

      - name: Verify handout HTML offline
        run: python3 -B tools/handout/test_generate.py

      - name: Run tests (Pest)
        run: ./vendor/bin/pest

      - name: Verify bounded private planner HTTP transport on loopback
        run: python3 -m unittest discover -s tests/transport -v

  assets:
    name: assets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Validates the Vite + Tailwind + self-hosted fonts pipeline builds cleanly.
      - run: npm run build
      - run: node --test tests/js/*.test.js
