name: Handout

# Pull requests validate deterministic QA snapshots without live API calls.
# Only manual/scheduled builds fetch current data and upload the live handout.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'
  pull_request:
    paths:
      - 'tools/handout/**'
      - '.github/workflows/handout.yml'
  push:
    branches: [main]
    paths:
      - 'tools/handout/**'
      - '.github/workflows/handout.yml'

permissions:
  contents: read

concurrency:
  group: handout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: validate and build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install host PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build the isolated distro renderer
        run: docker --context default build --tag public-universe-handout:bookworm tools/handout

      - name: Test HTML generation without network data
        run: python3 -B tools/handout/test_generate.py

      - name: Render and validate both offline handouts
        run: python3 -B tools/handout/pdf_smoke.py --docker-context default --docker-image public-universe-handout:bookworm

      - uses: actions/upload-artifact@v4
        with:
          name: handout-offline-qa
          path: |
            output/pdf/*-qa.pdf
            output/pdf/validation.json
            tmp/pdfs/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Fetch current data for the live handout
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/handout/generate.py --html-only --out output/pdf/solar-handout.pdf

      - name: Render and validate the live handout
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 -B tools/handout/pdf_smoke.py --docker-context default --docker-image public-universe-handout:bookworm --render-html output/pdf/solar-handout.html

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: solar-handout
          path: output/pdf/solar-handout.pdf
          if-no-files-found: error
          retention-days: 90
