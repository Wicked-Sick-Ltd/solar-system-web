name: Community releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-releases
  cancel-in-progress: false

jobs:
  release-please:
    # An App token makes release PRs trigger the normal CI/review workflows.
    # No GITHUB_TOKEN fallback: bot-created PRs otherwise silently miss checks.
    if: vars.RELEASE_APP_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create repository-scoped release token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: solar-system-web
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Update the release PR or tag an approved release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
