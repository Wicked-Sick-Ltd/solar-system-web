name: Deterministic performance budgets

on:
  pull_request:
    branches: [main, 'codex/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, curl, dom, fileinfo, intl
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - name: Assert production asset weights and deferred renderer
        run: |
          mkdir -p performance-results
          node tools/performance/assets.mjs > performance-results/assets.json
          node --test tests/js/performance-assets.test.js tests/js/galaxy-bundle.test.js tests/js/galaxy-lifecycle.test.js tests/js/galaxy-navigation.test.js tests/js/galaxy-renderer.test.js
      - name: Measure isolated request kernels and assert structural budgets
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PERFORMANCE_REQUIRED: '1'
          PERFORMANCE_MACHINE: GitHub hosted ubuntu-latest; hardware varies
          PERFORMANCE_REPORT: performance-results/routes.json
        run: php -d memory_limit=512M vendor/bin/pest tests/Feature/RoutePerformanceTest.php
      - name: Retain synthetic performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-performance-${{ github.sha }}
          path: performance-results/*.json
          if-no-files-found: warn
          retention-days: 14
